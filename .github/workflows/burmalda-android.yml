name: Бурмалда — Android APK

on:
  push:
    paths:
      - 'burmalda/**'
      - '.github/workflows/burmalda-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: burmalda-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: burmalda
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: burmalda/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build APK
        working-directory: burmalda/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk burmalda.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: burmalda-apk
          path: burmalda/burmalda.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete burmalda-latest --yes --cleanup-tag || true
          gh release create burmalda-latest burmalda.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Бурмалда — APK для Android" \
            --notes "Свежая сборка из ${{ github.ref_name }} (${{ github.sha }}). Скачай burmalda.apk на телефон и установи."
